name: Deploy to Server - Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install dependencies
        run: npm ci

      - name: Check API key
        run: |
          if [ -z "$MAPTILER_API_KEY" ]; then
            echo "❌ ERROR: MAPTILER_API_KEY is not set!"
            echo ""
            echo "Since you're using 'environment: Prod', set it as an Environment Variable or Secret:"
            echo "1. Go to: Repository → Settings → Environments → 'Prod'"
            echo "2. Add variable/secret: MAPTILER_API_KEY"
            echo ""
            exit 1
          else
            echo "✅ MAPTILER_API_KEY is set (length: ${#MAPTILER_API_KEY} characters)"
          fi
        env:
          MAPTILER_API_KEY: ${{ vars.MAPTILER_API_KEY }}

      - name: Build SvelteKit
        run: npm run build
        env:
          DATABASE_URL: "postgres://user:pass@localhost:5432/dummy"
          PUBLIC_MAPTILER_API_KEY: ${{ vars.MAPTILER_API_KEY }}

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source:  "./package.json,build/**"
          strip_components: 1
          target: /var/www/apps/knallmelder/current

      - name: Wait for file sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "⏳ Waiting for file sync..."
            sleep 2
            echo "📦 Verifying package.json was uploaded:"
            cat /var/www/apps/knallmelder/current/package.json | grep version || echo "package.json not found"

      - name: Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🔍 Debugging PM2 restart..."
            echo "Current directory: $(pwd)"
            echo ""
            echo "📁 Checking /var/www/apps/ directory:"
            ls -la /var/www/apps/ || echo "Directory not found or no access"
            echo ""
            echo "📄 Checking for ecosystem config files:"
            ls -la /var/www/apps/*.config.js /var/www/apps/ecosystem.config.js 2>/dev/null || echo "No ecosystem config found"
            echo ""
            echo "🔧 PM2 status before restart:"
            pm2 list || echo "PM2 not running or no apps"
            echo ""
            echo "🔄 Attempting PM2 restart..."
            cd /var/www/apps/
            echo "Changed to: $(pwd)"
            # Stop and reload to ensure fresh code is loaded
            # Use --update-env to update environment variables
            pm2 restart knallmelder --update-env || pm2 restart all --update-env
            echo ""
            echo "✅ PM2 status after restart:"
            pm2 list || echo "PM2 not available"
